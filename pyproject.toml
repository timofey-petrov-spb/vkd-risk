# Настройки инструментов разработки. Зависимости объявлены ТОЛЬКО в requirements.txt.
#
# Почему здесь нет [project] и [build-system]. Streamlit Community Cloud при наличии обоих файлов
# пишет в журнал сборки «WARN: More than one requirement» и ставит окружение по pyproject.toml как
# по устанавливаемому проекту: в журнале 19.09.2026 это дало «Audited 1 package in 1ms» вместо
# установки девяти библиотек, после чего приложение не доходило до первого экрана. Один источник
# зависимостей — requirements.txt с закреплёнными версиями; он же используется локально.
#
# Если понадобится устанавливаемый пакет (сборка колеса, публикация), разделы [project] и
# [build-system] возвращают вместе с решением, чем ставит окружение площадка.

[tool.pytest.ini_options]
testpaths = ["tests"]
