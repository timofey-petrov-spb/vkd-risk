[project]
name = "vkd-risk"
version = "0.1.0"
description = "Прогнозирование внешних рисков и планирование ВКД на МКС — исследовательский прототип поддержки решений"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "sgp4>=2.23",
    "skyfield>=1.49",
    "ppigrf>=2.0",
    "requests>=2.32",
    "plotly>=5.24",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = ["scikit-learn>=1.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vkd*", "app*"]
