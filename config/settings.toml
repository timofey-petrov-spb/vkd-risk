# Настройки сервиса «ВКД-Риск» вне кода (критерий Т7). Путь переопределяется VKD_SETTINGS.
# Каждое применённое значение попадает в снимок расчёта (ключ effective_config) и выгрузку — изменение здесь не бывает молчаливым.
# Секретов нет: все источники открытые. Ключи доступа, если появятся, — только через переменные окружения.

[thresholds]                       # пороги условий; источник шкал — NOAA SWPC Space Weather Scales
goes_p10_warning_pfu = 10.0        # S1: предупреждение о протонном событии (≥10 МэВ)
goes_p10_priority_pfu = 1000.0     # S3: приоритетное предупреждение (NOAA: избегать ВКД)
kp_check = 7.0                     # G3: триггер проверки — наблюдение, уведомление, прогноз NOAA и ENLIL
goes_max_age_min = 60.0            # горизонт наблюдения GOES: на участки окна дальше этого наблюдение не распространяется
kp_max_age_min = 180.0             # давность наблюдения Kp (один 3-часовой интервал): старше — условие не ставится, покрытие частичное
equiv_tol_min = 5.0                # стартовый допуск равнозначности по минутам; заменяется разбросом разности на сетке порогов
fluence_equiv_ratio = 1.5          # допуск равнозначности по флюенсу (отношение); нижняя граница, заменяется разбросом по каналу
e_min_MeV = 30.0                   # канал захваченных протонов для флюенса (сетка ОСТ прил. А)
saa_B_threshold_nT = 24000.0       # порог |B| области аномалии для ~420 км; варьируется в чувствительности
tle_max_age_days = 3.0             # A3: допустимый возраст TLE относительно обеих границ горизонта

[sources]
timeout_s = 6                      # тайм-аут живого запроса (CelesTrak при отказе молчит до тайм-аута); далее резервы, кеш, снимок
cache_ttl_s = 300                  # повторный живой запрос не чаще, чем раз в 5 минут (частота GOES); применяется слоем экрана

[sources.urls]
goes = "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-3-day.json"
# TLE МКС: адреса пробуются по порядку, первый разобранный ответ идёт в расчёт, адрес — в манифест.
# CelesTrak — первичный; 19.09.2026 оба его адреса давали тайм-аут, поэтому резервы обязательны.
tle = [
  "https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE",
  "https://api.wheretheiss.at/v1/satellites/25544/tles",
  "https://tle.ivanstanojevic.me/api/tle/25544",
]

[history]
enlil_kp_fields = ["kp_90"]        # оценка Kp прогона WSA-ENLIL для условия: kp_90 — типичная;
                                   # обоснование — docs/EKSPERIMENTY_PROGNOZ.md (kp_180 давал 54 ложные тревоги против 3)
sep_valid_hours = 24               # действие протонного события без известного конца, ч (конвенция прототипа);
                                   # читается в Thresholds.sep_valid_hours и печатается в тексте условия

[ui]
duration_min = 360                 # длительность ВКД по умолчанию (постановка: 60…480)
search_min = 720                   # период поиска начала по умолчанию (постановка: до 1440)
window_offsets_min = [120, 360]    # сдвиги окон-кандидатов по умолчанию от начала периода поиска (окно «прямо сейчас» нереалистично)
auto_refresh_min = 5               # автообновление в текущем режиме (0 — выключено)
