# Оформление: три цвета и один шрифт (docs/ZAMYSEL.md, раздел 5.2).
# Акцент — синий (наш расчёт), тревога задаётся в коде красным, остальное серое.
[theme]
base = "light"
primaryColor = "#1f4e79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f7"
textColor = "#1a1a1a"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false

[server]
headless = true
