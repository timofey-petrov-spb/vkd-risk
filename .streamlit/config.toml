# Оформление: монотонная академическая система (PROPOSAL_A п. 2), один шрифт, без градиентов.
# Цвет означает происхождение величины, а не «хорошо/плохо»: синий — наш расчёт (акцент ниже),
# зелёный — наблюдение, янтарный — внешний прогноз, красный — условие, аномалия или отказ,
# серый — данных нет. Кеш цвет НЕ меняет: наблюдение из кеша остаётся зелёным, а его давность
# объявляется подписью (R4-28; иначе наблюдение из кеша и внешний прогноз идут одним тоном, и
# различие происхождений, ради которого система цветов заведена, на экране не читается).
# Оттенки заданы в app/ui.py (:root), здесь — только базовая тема Streamlit.
# Тема ТЁМНАЯ: экран смотрят в затемнённом зале, и светлая заливка на проекторе слепит. Одной
# правкой стилей в app/ui.py не обойтись — собственные виджеты Streamlit красятся ЭТОЙ темой, и
# светлые поля ввода на тёмной странице читались бы как поломка. Оттенки величин заданы в
# app/ui.py (:root) и пересчитаны под тёмный фон с проверкой контраста; здесь — только основа.
[theme]
base = "dark"
primaryColor = "#7ab8f5"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b26"
textColor = "#e8ebf2"
font = "sans serif"

# Зрителю — только тип ошибки без трассировки и локальных путей (Т7); полная трассировка пишется в лог сервера.
[client]
toolbarMode = "minimal"
showErrorDetails = "type"

[browser]
gatherUsageStats = false

[server]
headless = true
