# Оформление: монотонная академическая система (PROPOSAL_A п. 2), один шрифт, без градиентов.
# Цвет означает происхождение величины, а не «хорошо/плохо»: синий — наш расчёт (акцент ниже),
# зелёный — наблюдение, янтарный — внешний прогноз или кеш, красный — условие, аномалия или отказ,
# серый — данных нет. Оттенки заданы в app/ui.py (:root), здесь — только базовая тема Streamlit.
[theme]
base = "light"
primaryColor = "#1f4e79"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f7"
textColor = "#1a1a1a"
font = "sans serif"

# Зрителю — только тип ошибки без трассировки и локальных путей (Т7); полная трассировка пишется в лог сервера.
[client]
toolbarMode = "minimal"
showErrorDetails = "type"

[browser]
gatherUsageStats = false

[server]
headless = true
